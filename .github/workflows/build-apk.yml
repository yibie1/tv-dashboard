name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Expo CLI
        run: npm install -g expo-cli @expo/cli

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Force Kotlin version to 1.9.24
        run: |
          # Update gradle.properties
          sed -i 's/^kotlinVersion=.*/kotlinVersion=1.9.24/' android/gradle.properties || echo 'kotlinVersion=1.9.24' >> android/gradle.properties
          sed -i 's/^android.kotlinVersion=.*/android.kotlinVersion=1.9.24/' android/gradle.properties || echo 'android.kotlinVersion=1.9.24' >> android/gradle.properties
          
          # Update root build.gradle
          cat >> android/build.gradle << 'EOF'
          
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('kotlin')) {
                      project.ext.kotlinVersion = '1.9.24'
                  }
                  if (project.hasProperty('kotlinVersion')) {
                      project.ext.kotlinVersion = '1.9.24'
                  }
              }
          }
          EOF
          
          # Update app/build.gradle
          cat >> android/app/build.gradle << 'EOF'
          
          configurations.all {
              resolutionStrategy {
                  eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          details.useVersion '1.9.24'
                      }
                  }
              }
          }
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Clean build
        run: ./gradlew clean
        working-directory: android

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ethiopian-tv-dashboard-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30