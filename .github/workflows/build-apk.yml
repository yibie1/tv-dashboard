name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform android --clean --no-install
        env:
          NODE_ENV: production

      - name: Pin Kotlin version
        run: |
          # Force kotlin version in gradle.properties (remove old, append new)
          grep -v 'android.kotlinVersion' android/gradle.properties > /tmp/gp.tmp && mv /tmp/gp.tmp android/gradle.properties
          echo 'android.kotlinVersion=1.9.24' >> android/gradle.properties
          # Patch the fallback in build.gradle
          python3 -c "
          import re
          with open('android/build.gradle', 'r') as f:
              c = f.read()
          c = re.sub(r\"findProperty\('android\.kotlinVersion'\) \?:\s*'[^']+'\", \"findProperty('android.kotlinVersion') ?: '1.9.24'\", c)
          with open('android/build.gradle', 'w') as f:
              f.write(c)
          "
          echo '--- Kotlin check ---'
          grep -i kotlin android/gradle.properties
          grep -i kotlinVersion android/build.gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ethiopian-tv-dashboard-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
