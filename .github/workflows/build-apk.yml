name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Expo CLI
        run: npm install -g expo-cli @expo/cli

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Fix Kotlin version compatibility
        run: |
          # Method 1: Force Kotlin version in gradle.properties
          echo "kotlinVersion=1.9.24" >> android/gradle.properties
          echo "android.kotlinVersion=1.9.24" >> android/gradle.properties
          
          # Method 2: Add resolution strategy to app/build.gradle
          cat >> android/app/build.gradle << 'EOF'
          
          // Force Kotlin version
          configurations.all {
              resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                  if (details.requested.group == 'org.jetbrains.kotlin') {
                      details.useVersion '1.9.24'
                  }
              }
          }
          EOF
          
          # Method 3: Update root build.gradle to set Kotlin version before evaluation
          sed -i '1i buildscript {\n    ext.kotlin_version = "1.9.24"\n}\n' android/build.gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Clean build
        run: ./gradlew clean
        working-directory: android

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ethiopian-tv-dashboard-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30