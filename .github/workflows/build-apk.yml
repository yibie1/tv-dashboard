name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Expo CLI
        run: npm install -g expo-cli @expo/cli

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Fix Kotlin version and dependencies
        run: |
          # Force Kotlin version to 1.9.24 in gradle.properties
          cat >> android/gradle.properties << 'EOF'
          kotlinVersion=1.9.24
          android.kotlinVersion=1.9.24
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
          EOF
          
          # Update root build.gradle to set Kotlin version
          cat > android/build.gradle.new << 'EOF'
          buildscript {
              ext.kotlin_version = '1.9.24'
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://www.jetbrains.com/packages/' }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          EOF
          
          # Append the rest of the original build.gradle
          tail -n +$(grep -n "^allprojects" android/build.gradle | cut -d: -f1) android/build.gradle >> android/build.gradle.new
          mv android/build.gradle.new android/build.gradle
          
          # Force Kotlin version in all modules
          find android -name "build.gradle" -type f -exec sed -i '1i buildscript {\n    ext.kotlin_version = "1.9.24"\n}\n' {} \;

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Clean build
        run: ./gradlew clean
        working-directory: android

      - name: Build Release APK with detailed logging
        run: ./gradlew assembleRelease --no-daemon --stacktrace --info > build.log 2>&1 || (cat build.log && exit 1)
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build.log
          retention-days: 7

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ethiopian-tv-dashboard-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30