name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Expo CLI
        run: npm install -g expo-cli @expo/cli

      - name: Clean previous builds
        run: |
          rm -rf android
          rm -rf ios

      - name: Run Expo Prebuild with dependencies
        run: |
          npx expo prebuild --platform android --clean --install
          # Verify android folder was created
          ls -la android/

      - name: Fix build.gradle files
        run: |
          # Ensure app/build.gradle has all required configuration
          cat > android/app/build.gradle << 'EOF'
          apply plugin: "com.android.application"
          apply plugin: "com.facebook.react"
          
          def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
          
          react {
              entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry.js', $projectRoot, 'android')"].execute().text.trim())
              reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute().text.trim()).getParentFile().getAbsoluteFile()
              hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute().text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
              codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json')"].execute().text.trim()).getParentFile().getAbsoluteFile()
          }
          
          android {
              compileSdkVersion 34
              buildToolsVersion "34.0.0"
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              
              defaultConfig {
                  applicationId "com.ethiopiantv.dashboard"
                  minSdkVersion 24
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0.0"
              }
              
              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
                  release {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                  }
              }
          }
          
          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
          }
          EOF
          
          # Create debug keystore if it doesn't exist
          cd android/app
          if [ ! -f debug.keystore ]; then
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
          fi
          cd ../..

      - name: Fix root build.gradle
        run: |
          cat > android/build.gradle << 'EOF'
          buildscript {
              ext {
                  buildToolsVersion = "34.0.0"
                  minSdkVersion = 24
                  compileSdkVersion = 34
                  targetSdkVersion = 34
                  kotlinVersion = "1.9.24"
              }
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath("com.android.tools.build:gradle:8.1.1")
                  classpath("com.facebook.react:react-native-gradle-plugin")
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
              }
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  mavenLocal()
                  maven {
                      url("$rootDir/../node_modules/react-native/android")
                  }
                  maven {
                      url("$rootDir/../node_modules/jsc-android/dist")
                  }
                  maven {
                      url "https://www.jetbrains.com/packages/"
                  }
              }
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g
          android.useAndroidX=true
          android.enableJetifier=true
          kotlinVersion=1.9.24
          EOF

      - name: Create settings.gradle
        run: |
          cat > android/settings.gradle << 'EOF'
          rootProject.name = 'Ethiopian TV Dashboard'
          
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
                  mavenLocal()
              }
          }
          
          apply from: file("../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesSettingsGradle(settings)
          
          include ':app'
          includeBuild('../node_modules/@react-native/gradle-plugin')
          EOF

      - name: Make gradlew executable
        run: |
          chmod +x android/gradlew
          ls -la android/

      - name: Generate bundle and build APK
        run: |
          cd android
          # First create bundle
          ./gradlew bundleRelease --no-daemon
          # Then build APK from bundle
          ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ethiopian-tv-dashboard-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30